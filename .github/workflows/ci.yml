name: CI

on:
  push:
    branches: [main]
  pull_request:
  # release.yml calls this, so a tag cannot publish without passing the gate.
  workflow_call:

permissions:
  contents: read

concurrency:
  # github.workflow keeps the release's call from cancelling a push run on the
  # same commit, and the reverse.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # The commit gate from AGENTS.md, on both platforms mule ships for.
  gate:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      # Layers 2 and 3 skip when tmux or /usr/sbin/sshd is missing, so a bare
      # runner would pass while testing nothing those layers exist for.
      # Install both so CI runs them.
      - name: Install tmux and sshd (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tmux openssh-server zsh
      - name: Install tmux (macOS)
        if: runner.os == 'macOS'
        run: brew install tmux
      - name: Rust toolchain
        run: rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      # Fail, rather than skip, if the installs above did not take.
      - run: cargo test --locked
        env:
          MULE_REQUIRE_LAYERS: "1"

  # Build with the rust-version Cargo.toml claims. It is read from the file
  # so the claim and the check cannot drift apart. The first run of this job
  # found the claim was 1.85 while let-chains need 1.88.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install the declared toolchain
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          echo "MSRV=$msrv" >> "$GITHUB_ENV"
          rustup toolchain install "$msrv" --profile minimal
      - uses: Swatinem/rust-cache@v2
      - run: cargo +"$MSRV" check --all-targets --locked

  # The crate ships only the `include` list in Cargo.toml. Catch a missing file
  # here rather than on release day.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - run: cargo publish --dry-run --locked
